[project]
name = "watts-happening"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
# Keep the deployed API dependencies aligned with backend/requirements.txt.
# The root requirements.txt also contains optional, local data-analysis tools.
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "pymongo>=4.16,<5",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.app:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"

[tool.vercel.fastapi.static]
# Static UI assets do not need the API's CORS/GZip middleware.
cdn = true
# Keep frontend/dist available for the existing StaticFiles mount at startup.
exclude = false
